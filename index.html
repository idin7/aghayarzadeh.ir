<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ولی‌اله آقایارزاده | Valiollah Aghayarzadeh</title>
<meta name="description" content="سایت رسمی ولی‌اله آقایارزاده، اقتصاددان، پژوهشگر، نویسنده و مشاور اقتصادی — Official website of Valiollah Aghayarzadeh, economist, researcher, author and consultant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1c17; --ink-2:#102a23; --green:#1d5646; --green-2:#2c7a63;
  --gold:#c8a25a; --gold-2:#e8cd92; --paper:#f7f4ec; --paper-2:#eee8d9; --card:#fffdf8;
  --text:#1a2622; --muted:#5b6964; --line:rgba(11,28,23,.12);
  --display:"Vazirmatn",system-ui,sans-serif; --sans:"Vazirmatn",system-ui,sans-serif;
  --r:18px; --max:1180px;
}
html[lang=en]{ --display:"Fraunces",Georgia,serif; --sans:"Inter","Vazirmatn",system-ui,sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--text);line-height:1.85;font-size:16px;overflow-x:hidden}
html[lang=en] body{line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media(max-width:600px){.wrap{padding:0 16px}}

/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:.35s}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:74px}
.nav.solid{background:rgba(11,28,23,.92);backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(232,205,146,.15)}
.brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700}
.brand .dot{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold-2);font-family:var(--display);font-size:14px}
.brand .dot.flag{width:56px;height:32px;border-radius:5px;overflow:hidden;padding:0;border:1.5px solid var(--gold);background:#fff}
.brand .dot.flag img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--gold-2);opacity:.85;line-height:1.3}
.brand b{line-height:1.3;font-size:15px}
.links{display:flex;gap:26px;align-items:center}
.links a{color:rgba(255,255,255,.78);font-size:14.5px;transition:.2s}
.links a:hover{color:var(--gold-2)}
.lang{border:1px solid rgba(232,205,146,.55);color:var(--gold-2);background:transparent;border-radius:99px;padding:6px 16px;font:600 13px var(--sans);cursor:pointer;transition:.2s}
.lang:hover{background:var(--gold);color:var(--ink)}
.burger{display:none;background:none;border:0;color:#fff;cursor:pointer}
@media(max-width:920px){
  .links{position:fixed;inset:74px 0 auto 0;flex-direction:column;background:var(--ink);padding:20px;gap:14px;transform:translateY(-130%);transition:.35s}
  .links.open{transform:none}
  .burger{display:block}
}

/* HERO */
.hero{position:relative;min-height:100vh;background:radial-gradient(1200px 600px at 15% 10%,#1b4a3d 0%,transparent 60%),radial-gradient(900px 500px at 90% 90%,#2a3a1c 0%,transparent 60%),var(--ink);color:#fff;display:flex;align-items:center;overflow:hidden;padding:120px 0 80px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(232,205,146,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(232,205,146,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:60px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--gold-2);font-size:14px;letter-spacing:.02em;margin-bottom:22px}
html[lang=en] .kicker{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
.kicker::before{content:"";width:34px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,6.4vw,78px);line-height:1.15;margin-bottom:24px}
html[lang=en] .hero h1{font-weight:600;letter-spacing:-.02em;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);color:rgba(255,255,255,.78);max-width:600px;margin-bottom:36px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;font-weight:600;font-size:15px;transition:.25s}
.btn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--ink)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,162,90,.35)}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.ghost:hover{border-color:var(--gold-2);color:var(--gold-2)}
.portrait{position:relative;aspect-ratio:4/5;max-width:400px;justify-self:center;width:100%}
.portrait .frame{position:absolute;inset:0;border-radius:200px 200px 24px 24px;background:linear-gradient(160deg,#245a4a,#0f2a22 70%);border:1px solid rgba(232,205,146,.35);overflow:hidden;display:grid;place-items:center}
.portrait .frame img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.portrait .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,28,23,.55),transparent 40%);pointer-events:none}
.portrait .mono{font-family:"Fraunces",serif;font-size:110px;color:rgba(232,205,146,.85);font-weight:600}
.portrait .ring{position:absolute;inset:-22px;border-radius:222px 222px 40px 40px;border:1px dashed rgba(232,205,146,.3)}
.portrait svg.chart{position:absolute;inset:auto 0 0 0;width:100%;height:45%;opacity:.9}
.chart path.l{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.badge{position:absolute;background:rgba(255,253,248,.96);color:var(--ink);border-radius:14px;padding:12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.35);font-size:13px;line-height:1.5;animation:float 6s ease-in-out infinite}
.badge b{display:block;font-family:var(--display);font-size:22px;color:var(--green)}
.badge.b1{top:14%;inset-inline-end:-30px}
.badge.b2{bottom:10%;inset-inline-start:-34px;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-10px)}}
.scroll{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll i{width:1px;height:40px;background:linear-gradient(var(--gold),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:920px){
  .hero .wrap{grid-template-columns:1fr;gap:50px}
  .portrait{max-width:300px}
  .badge.b1{inset-inline-end:-10px;top:-14px}.badge.b2{inset-inline-start:-10px;bottom:-22px}
  .scroll{display:none}
}

/* STATS */
.stats{background:var(--ink-2);color:#fff;border-top:1px solid rgba(232,205,146,.15)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:34px 22px;border-inline-start:1px solid rgba(232,205,146,.14)}
.stat:first-child{border:0}
.stat b{font-family:var(--display);font-size:clamp(30px,3.6vw,44px);color:var(--gold-2);display:block;line-height:1.2}
.stat span{font-size:14px;color:rgba(255,255,255,.7)}
@media(max-width:760px){.stats .wrap{grid-template-columns:1fr 1fr}.stat:nth-child(3){border:0}.stat{border-top:1px solid rgba(232,205,146,.14)}}

/* SECTIONS */
section.sec{padding:110px 0}
@media(max-width:600px){section.sec{padding:76px 0}}
.eyebrow{color:var(--green-2);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
html[lang=en] .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.8vw,46px);line-height:1.3;color:var(--ink);margin-bottom:18px}
html[lang=en] h2{font-weight:600;letter-spacing:-.015em;line-height:1.15}
.intro{color:var(--muted);max-width:760px;font-size:17px}
h3{font-family:var(--display);font-weight:700;color:var(--ink);font-size:20px;margin-bottom:14px}
html[lang=en] h3{font-weight:600}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;margin-top:40px}
.about-text p{font-size:17.5px;margin-bottom:18px}
.about-text p:first-child::first-letter{font-family:var(--display);color:var(--green)}
.side{display:flex;flex-direction:column;gap:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.box.edu{background:linear-gradient(135deg,var(--green),#15392f);color:#fff;border:0}
.box.edu h3{color:var(--gold-2)}
.box.edu p{font-size:18px;font-weight:600}
ul.checks{list-style:none;display:flex;flex-direction:column;gap:10px}
ul.checks li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
ul.checks li::before{content:"";flex:none;width:8px;height:8px;margin-top:.7em;border-radius:50%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{background:var(--paper-2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.studies{margin-top:56px}
@media(max-width:920px){.about-grid{grid-template-columns:1fr;gap:34px}}

/* EXPERTISE */
.expertise{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.expertise h2{color:#fff}.expertise .intro{color:rgba(255,255,255,.68)}
.expertise .eyebrow{color:var(--gold-2)}
.xgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:48px}
.xcard{border:1px solid rgba(232,205,146,.18);border-radius:var(--r);padding:26px 20px;background:rgba(255,255,255,.02);transition:.3s;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.xcard::after{content:"";position:absolute;inset:auto -40% -60% auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--gold),transparent 70%);opacity:0;transition:.4s}
.xcard:hover{transform:translateY(-6px);border-color:var(--gold)}
.xcard:hover::after{opacity:.25}
.xcard .n{font-family:"Fraunces",serif;color:var(--gold);font-size:14px}
.xcard b{font-size:17px;font-weight:700;line-height:1.5}
@media(max-width:1000px){.xgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.xgrid{grid-template-columns:1fr 1fr}.xcard{min-height:120px;padding:20px 16px}}

/* TIMELINE */
.tl{position:relative;margin-top:56px;padding-inline-start:44px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:11px;width:2px;background:linear-gradient(var(--gold),var(--green) 60%,transparent)}
.item{position:relative;margin-bottom:26px}
.item::before{content:"";position:absolute;inset-inline-start:-40px;top:28px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(200,162,90,.15)}
.item .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;transition:.3s}
.item .card:hover{box-shadow:0 18px 40px rgba(11,28,23,.08);border-color:rgba(200,162,90,.5)}
.org{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--green-2);font-weight:700;font-size:14px;margin-bottom:6px}
.year{background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 12px;font-size:12.5px}
.item h4{font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink);line-height:1.6;margin-bottom:8px}
html[lang=en] .item h4{font-weight:600;line-height:1.35}
.item p{color:var(--muted);font-size:15.5px}
.item .chips{margin-top:12px}
.item .chip{font-size:13px;background:#f3efe3}
@media(max-width:600px){.tl{padding-inline-start:32px}.item::before{inset-inline-start:-30px}.tl::before{inset-inline-start:7px}.item .card{padding:20px}}

/* RESEARCH */
.research{background:var(--paper-2)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:44px}
.rgrid .box p{color:var(--muted);font-size:16px}
.big{font-family:var(--display);font-size:64px;font-weight:900;color:var(--green);line-height:1}
html[lang=en] .big{font-weight:700}
.media-list{display:grid;gap:10px;margin-top:8px}
.media-list div{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-radius:12px;font-weight:600}
.media-list div::before{content:"";width:6px;height:22px;background:var(--gold);border-radius:3px}
.topics{margin-top:22px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.topic{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;align-items:flex-start}
.topic i{font-style:normal;font-family:"Fraunces",serif;color:var(--gold);font-weight:600;flex:none}
@media(max-width:920px){.rgrid{grid-template-columns:1fr}.tgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.tgrid{grid-template-columns:1fr}}

/* VIEWS */
.views-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:56px;align-items:start}
.quote{position:sticky;top:110px;background:linear-gradient(150deg,var(--green),var(--ink));color:#fff;border-radius:24px;padding:40px;overflow:hidden}
.quote::before{content:"";position:absolute;top:-30px;inset-inline-end:20px;font-family:"Fraunces",serif;font-size:220px;color:rgba(232,205,146,.15);line-height:1}
.quote p{font-family:var(--display);font-size:22px;line-height:1.8;position:relative}
html[lang=en] .quote p{line-height:1.45}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.v{padding:18px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;display:flex;gap:12px;align-items:center;transition:.25s}
.v:hover{background:var(--green);color:#fff}
.v svg{flex:none;color:var(--gold)}
.intl{margin-top:22px;border-inline-start:3px solid var(--gold);padding:6px 20px}
.intl p{color:var(--muted)}
@media(max-width:920px){.views-wrap{grid-template-columns:1fr}.quote{position:relative;top:0}}
@media(max-width:520px){.vlist{grid-template-columns:1fr}}

/* ROLES */
.roles{background:var(--ink);color:#fff}
.roles h2{color:#fff}.roles .eyebrow{color:var(--gold-2)}
.rolelist{list-style:none;margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;counter-reset:r}
.rolelist li{counter-increment:r;display:flex;gap:18px;padding:18px 0;border-bottom:1px solid rgba(232,205,146,.14);color:rgba(255,255,255,.85);font-size:15.5px;align-items:baseline}
.rolelist li::before{content:counter(r,decimal-leading-zero);font-family:"Fraunces",serif;color:var(--gold);font-size:14px;flex:none}
html[lang=fa] .rolelist li::before{content:counter(r,persian)}
@media(max-width:820px){.rolelist{grid-template-columns:1fr}}

/* CONTACT */
.contact .panel{background:linear-gradient(135deg,var(--green) 0%,var(--ink) 100%);border-radius:28px;padding:64px;color:#fff;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.contact .panel::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(232,205,146,.2);inset-inline-end:-120px;top:-160px}
.contact h2{color:#fff}.contact .eyebrow{color:var(--gold-2)}
.contact .intro{color:rgba(255,255,255,.75)}
.clinks{display:grid;gap:12px;position:relative;z-index:1}
.clink{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(232,205,146,.25);transition:.25s}
.clink:hover{background:var(--gold);color:var(--ink)}
.clink span{font-weight:600}
.clink small{opacity:.7;direction:ltr}
@media(max-width:820px){.contact .panel{grid-template-columns:1fr;padding:36px 22px}}

footer{padding:34px 0;color:var(--muted);font-size:14px;text-align:center}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}*{animation:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => s;
const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>';

function render(lang){
  const t = D[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-h]').forEach(el => el.innerHTML = t[el.dataset.h]);
  $('#langBtn').textContent = t.langBtn;
  $('#links').innerHTML = t.nav.map(([h,l]) => `<a href="${h}">${l}</a>`).join('');
  $('#stats').innerHTML = t.stats.map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#aboutP').innerHTML = t.aboutP.map(p => `<p>${p}</p>`).join('');
  $('#mem').innerHTML = t.mem.map(m => `<li>${m}</li>`).join('');
  $('#study').innerHTML = t.study.map(m => `<span class="chip">${m}</span>`).join('');
  const num = i => { const s = String(i+1).padStart(2,'0'); return lang==='fa' ? s.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]) : s; };
  $('#xgrid').innerHTML = t.expertise.map((x,i) => `<div class="xcard rv"><span class="n">${num(i)}</span><b>${x}</b></div>`).join('');
  $('#tl').innerHTML = t.career.map(c => `<div class="item rv"><div class="card">
      <div class="org">${c.org}${c.year?`<span class="year">${c.year}</span>`:''}</div>
      <h4>${c.role}</h4>${c.desc?`<p>${c.desc}</p>`:''}
      ${c.pts?`<div class="chips">${c.pts.map(p=>`<span class="chip">${p}</span>`).join('')}</div>`:''}
    </div></div>`).join('');
  $('#media').innerHTML = t.media.map(m => `<div>${m}</div>`).join('');
  $('#topics').innerHTML = t.topics.map((m,i) => `<div class="topic rv"><i>${num(i)}</i><span>${m}</span></div>`).join('');
  $('#vlist').innerHTML = t.views.map(v => `<div class="v rv">${arrow}<span>${v}</span></div>`).join('');
  $('#rolelist').innerHTML = t.roles.map(r => `<li class="rv">${r}</li>`).join('');
  $('#clinks').innerHTML = contacts.map(c => `<a class="clink" href="${c.href}"><span>${c[lang]}</span><small>${c.value}</small></a>`).join('');
  document.title = lang==='fa' ? 'ولی‌اله آقایارزاده | اقتصاددان و مشاور اقتصادی' : 'Valiollah Aghayarzadeh | Economist & Consultant';
  observe();
}

let io;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
}

let lang = 'fa';
try { const s = localStorage.getItem('lang'); if (s==='en'||s==='fa') lang = s; } catch(e){}
render(lang);
$('#langBtn').onclick = () => { lang = lang==='fa' ? 'en' : 'fa'; try{localStorage.setItem('lang',lang)}catch(e){} render(lang); };
$('#burger').onclick = () => $('#links').classList.toggle('open');
$('#links').addEventListener('click', e => { if (e.target.tagName==='A') $('#links').classList.remove('open'); });
const nav = $('#nav');
const onScroll = () => nav.classList.toggle('solid', scrollY > 40);
addEventListener('scroll', onScroll, {passive:true}); onScroll();
</script>
